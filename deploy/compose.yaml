# Проект tzcontrol. Запуск из /opt/tzcontrol/deploy: docker compose up -d --build
# Порты наружу не публикуются: трафик приходит через общий Caddy по сети web.
name: tzcontrol

services:
  tzcontrol:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_COMMIT: ${APP_COMMIT:-}     # APP_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
    image: tzcontrol:latest
    container_name: tzcontrol
    env_file: .env.prod
    environment:
      CACHE_DIR: /data/cache
    volumes:
      - cache:/data/cache
    networks:
      - web
    mem_limit: 512m
    restart: unless-stopped

volumes:
  cache:

networks:
  web:
    external: true
