  - id: G-14
    title: Не описан случай, когда накопленная сумма уже равна новому порогу или выше него (смена порога, включение уведомления)
    kind: incomplete
    keywords:
      - "уже (?:достиг|превы|накоплен|равн|выше|больше|не ниже)|равн\\w* (?:или|либо) (?:выше|больше|превыша)|(?:выше|больше|не ниже|превыша\\w*|равн\\w*) (?:или равн\\w* )?нов\\w* порог|≥|>=|нов\\w+ порог\\w* (?:ниже|меньше|не превыша)|порог\\w* (?:ниже|меньше) (?:уже |текущ\\w* )?(?:накоплен|расход|сумм)|при включении|момент\\w* включени|после включени|включени\\w* уведомлени|включа\\w+ уведомлени"
    severity: high
    core: true
    where: Часть A, Ф-4 / Ф-1
    anchors:
