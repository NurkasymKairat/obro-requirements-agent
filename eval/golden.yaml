# Эталон дефектов документа docs/requirements.md («Уведомление о расходах по карте»).
# Составлен вручную. НИКОГДА не попадает в промпты (проверяется: python eval/score.py --check).
#
# Поля записи:
#   id, title      — идентификатор и суть дефекта
#   kind, severity — как в Finding (agent/schemas.py)
#   core           — true: дефект обязан находиться (критичные и очевидные); false: желательный
#   where          — место в документе для человека
#   anchors        — группы дословных фрагментов документа. Группа = список альтернатив.
#                    Группа «задета», если цитата замечания пересекается с любой альтернативой.
#                    Для противоречия группы — это стороны противоречия.
#   min_groups     — сколько групп должно быть задето (по умолчанию 1; при пустом anchors — 0)
#   keywords       — регулярные выражения по тексту description + fix + criterion
#                    (нижний регистр, ё→е). Должны совпасть ВСЕ; альтернативы — через |.
document: docs/requirements.md

defects:
  # ---------- Часть A: противоречия ----------
  - id: G-01
    title: Критерий приёмки относит покупку 31 января к февралю, а Ф-2 определяет месяц по дате совершения покупки
    kind: contradiction
    keywords:
      - "феврал|январ"
      - "месяц|дат[аеуыой]"
      - "противореч|расход|не соответств|не согласу|вместо|должн\\w* .{0,80}январ|относит"
    severity: critical
    core: true
    where: Часть A, Ф-2 / Критерии приемки, строка 2
    anchors:
      - ["Месяц определяется по дате совершения покупки в Алматы"]
      - ["Февральский счётчик вырос на 4 000 ₸", "Провести 1 февраля в 00:03 по Алматы", "Покупка 31 января в 23:58 на 4 000 ₸"]

  - id: G-02
    title: Ф-3 ограничивает одним push в месяц, а Ф-4 требует push после смены порога независимо от истории
    kind: contradiction
    severity: critical
    core: true
    where: Часть A, Ф-3 / Ф-4
    anchors:
      - ["На карту приходится максимум один такой push за календарный месяц"]
      - ["следующее достижение вызывает push независимо от истории предыдущей настройки"]
    keywords:
      - "измен\\w* порог|нов\\w* порог|смен\\w* порог|ф-4|истори"
      - "один|одного|одним|повторн|втор|ф-3"

  - id: G-12
    title: Цель обещает уведомление «в момент покупки», а считаются проведённые покупки и на отправку отведена минута
    kind: contradiction
    severity: high
    core: true
    where: Часть A, Цели / Ф-2 / Нефункциональные требования
    anchors:
      - ["в момент покупки"]
      - ["В расходы входят проведённые покупки", "Сервис передаёт push на отправку в течение минуты после получения события", "Проведение покупки → пересчёт расходов"]
    keywords:
      - "момент"
      - "провед|минут|задерж|клиринг|авторизац|позже|не сразу"

  - id: G-30
    title: Ф-2 относит покупку к месяцу по дате совершения, а учитывает только проведённые покупки — не сказано, когда и в какой месяц попадает покупка, проведённая позже
    kind: ambiguous
    severity: high
    core: false
    where: Часть A, Ф-2
    anchors:
      - ["Месяц определяется по дате совершения покупки в Алматы", "В расходы входят проведённые покупки"]
    keywords:
      - "совершени|авторизац"
      - "проведен|клиринг|списани"
      - "неоднозначн|не определен|не совпада|невозможно однозначно|не ясно|неясно|расход[ия]тся"

  # ---------- Часть A: неполнота и неоднозначность ----------
  - id: G-13
    title: Не описано поведение после возврата — повторное достижение порога, возврат за закрытый месяц
    kind: incomplete
    keywords:
