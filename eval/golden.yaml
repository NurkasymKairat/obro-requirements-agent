    anchors:
      - ["Приложение читает и сохраняет настройки через дочерний документ"]
      - ["Сохранение порога. Функциональные требования: чтение порога"]
    keywords:
      - "чтени|читат|читает|получени\\w* настро|получить настро|получени\\w* порог"
      - "не описан|отсутств|нет метод|нет операци|нет описани|только сохранени|только один метод|противореч|не определен|не специфицирован"

  - id: G-06
    title: Типы amount и enabled расходятся — integer в запросе, string в ответе
    kind: contradiction
    keywords:
      - "string|строк"
      - "integer|числ|цел"
    severity: high
    core: true
    where: Часть B, Query-параметры / Ответ
    anchors:
      - ["| `amount` | integer | 32 bit |", "| `enabled` | integer | 1 знак |"]
      - ["| `amount` | string | При успехе |", "| `enabled` | string | «0» или «1» |", '{"result":"OK","amount":"50000","enabled":"1"}']

  - id: G-07
    title: В разделе 403 сказано возвращать 404; код 404 не описан в перечне статусов, а 403 фактически не используется
    kind: contradiction
    severity: high
    core: true
    where: Часть B, Статусы, 403
    anchors:
      - - "Для чужой карты возвращается 404, как и для отсутствующей карты"
        - "403. Unsuccessful — Forbidden"
        - "Ответ в случае, если на указанный ресурс доступ запрещен"
        - '{"message":"Карта не найдена"}'
    keywords: ["403|404"]

  - id: G-08
    title: Код 201 назван успешным, но не описан; заголовок примера «200 … Created» не соответствует коду
    kind: contradiction
    severity: medium
    core: false
    where: Часть B, Ответ / Статусы
    anchors:
