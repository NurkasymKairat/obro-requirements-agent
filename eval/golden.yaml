  # ---------- Часть B: REST API ----------
  - id: G-03
    title: Ошибка проверки суммы возвращается с кодом 200 и result ERROR, хотя 200 объявлен успехом, а неверные параметры — кодом 400
    kind: contradiction
    keywords:
      - "error|проверьте сумму|result|тел\\w* с ошибк|ошибк\\w* (?:в теле|валидаци|проверки суммы)|отказ"
      - "200"
    severity: critical
    core: true
    where: Часть B, Ответ / Статусы, пример 200
    anchors:
      - ['{"result":"ERROR","message":"Проверьте сумму"}', "200. Successful — Created"]
      - ["Ответ в случае, если параметры запроса заполнены неверно", "Если результат 200 или 201 — успешный", "Ответ в случае успешного выполнения метода"]

  - id: G-04
    title: Сохранение настройки выполняется методом GET с параметрами в строке запроса
    kind: contradiction
    severity: high
    core: true
    where: Часть B, Общие параметры
    anchors:
      - ["| **REST type** | GET |", "/alerts/saveLimit", "curl -G", "Сохранение порога", "Заменить настройку и вернуть результат сохранения"]
    keywords:
