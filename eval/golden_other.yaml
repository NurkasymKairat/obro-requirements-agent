# Эталон к eval/sample_other.md — синтетическому ТЗ из другой области для проверки обобщения.
# 16 заложенных дефектов. Формат тот же, что в golden.yaml. В промпты не попадает.
# Правила и промпты под этот документ не настраиваются.
document: eval/sample_other.md

defects:
  - id: O-01
    title: Критерий приёмки ожидает выполнение перевода, который превышает суточный лимит (250 000 + 300 000 > 500 000)
    kind: contradiction
    severity: critical
    core: true
    where: Часть A, П-3 / Критерии приёмки, строка 2
    anchors:
      - ["Сумма переводов клиента не превышает 500 000 ₸ в сутки"]
      - ["За сутки переведено 250 000 ₸, на счёте списания 400 000 ₸", "Перевести 300 000 ₸", "Перевод выполнен, остаток счёта списания 100 000 ₸"]
    keywords: ["лимит|500 000|550 000|превыша|превыс"]

  - id: O-02
    title: П-2 обещает перевод без комиссии при любых валютах, поле fee в API задаёт комиссию 0,5 % за конвертацию
    kind: contradiction
    severity: critical
    core: true
    where: Часть A, П-2 / Часть B, Поля ответа
    anchors:
      - ["Перевод выполняется без комиссии при любых валютах счетов"]
      - ["Комиссия за конвертацию: 0,5 % суммы при разных валютах счетов"]
    keywords: ["комисси|fee"]

  - id: O-03
    title: Минимальная сумма расходится — от 100 ₸ в П-2, от 1 в параметре amount
    kind: contradiction
    severity: high
    core: true
    where: Часть A, П-2 / Часть B, Параметры запроса
    anchors:
      - ["Сумма перевода — от 100 ₸ до остатка на счёте списания", "1–500 000, два знака после запятой"]
    keywords:
      - "100"
      - "миним|нижн\\w* границ|диапазон|от 1\\b|1[–-]500|\\b1 ₸|\\b1 тенге"

  - id: O-04
    title: Сумма хранится в целых тенге, а API принимает два знака после запятой и сумму в валюте счёта списания
    kind: contradiction
    severity: high
    core: true
    where: Часть A, Требования к данным / Часть B, Параметры запроса
    anchors:
      - ["сумма в целых тенге"]
      - ["1–500 000, два знака после запятой", "Сумма в валюте счёта списания", '"amount":1500.50']
    keywords: ["целы[хе]|дробн|знак\\w* после запятой|два знака|копе|тиын|точност|округл"]

  - id: O-05
    title: Повтор запроса с тем же requestId — шаг 4 требует вернуть результат первого запроса, статус 409 объявляет его конфликтом
    kind: contradiction
    severity: critical
    core: true
    where: Часть B, Логика работы, шаг 4 / Статусы, 409
    anchors:
      - ["вернуть результат первого запроса без повторного списания"]
      - ["Запрос с таким `requestId` уже был обработан", "409. Конфликт", '{"message":"Повторный запрос"}']
    keywords:
      - "requestid|идемпотент|повторн\\w+ запрос|повторе запрос|тем же ключ"
      - "409|конфликт"

  - id: O-06
    title: Счёт списания назван fromAccount в таблице параметров и sourceAccount в примере запроса
    kind: contradiction
    severity: high
    core: true
    where: Часть B, Общие параметры, Пример / Параметры запроса
    anchors:
      - ["| `fromAccount` | string | Да |", '"sourceAccount":"KZ01"']
    keywords: ["sourceaccount|fromaccount"]

  - id: O-07
    title: Код 422 используется в логике, но не описан в перечне статусов; код для превышения лимита не задан вовсе
    kind: incomplete
    severity: high
    core: true
    where: Часть B, Логика работы, шаг 3 / Статусы
    anchors:
      - ["При недостатке средств вернуть 422", "Проверить сумму, остаток и суточный лимит", "Неверные параметры запроса"]
    keywords: ["422|код\\w* (?:ответа |статуса |ошибки )?(?:для|при) превышени|статус\\w* (?:для|при) превышени"]

  - id: O-08
    title: Отмена перевода требуется в П-6 и в интеграции, но метода отмены в API нет, состояния «отменён» нет ни в данных, ни в ответе
    kind: incomplete
    severity: critical
    core: true
    where: Часть A, П-6 / Требования к интеграции / Часть B
    anchors:
      - - "Клиент может отменить перевод в течение 5 минут после подтверждения"
        - "Интернет-банк выполняет и отменяет перевод через дочерний документ"
        - "состояние (выполнен, отклонён)"
        - "DONE или REJECTED"
        - "Выполнение перевода между счетами одного клиента"
    keywords: ["отмен"]

  - id: O-09
    title: «Сутки» не определены — календарные или скользящие 24 часа, часовой пояс; не сказано, как в лимит входят переводы в иной валюте
    kind: ambiguous
    severity: high
    core: true
    where: Часть A, П-3
    anchors:
      - ["Сумма переводов клиента не превышает 500 000 ₸ в сутки"]
    keywords: ["24 час|календарн|скользящ|часов\\w* пояс|границ\\w* сут|начал\\w* сут|полноч|00:00|иностранн\\w* валют|в иной валют|в другой валют|валютн\\w* счет"]

  - id: O-11
    title: При превышении лимита «показывается сообщение» — не сказано, отклоняется ли перевод, и не задан текст
    kind: incomplete
    severity: high
    core: true
    where: Часть A, П-3
    anchors:
      - ["При превышении лимита клиенту показывается сообщение"]
    keywords: ["сообщени|отклон|текст|что происходит|не выполня|блокир"]

  - id: O-13
    title: Н-1 непроверяемо — «быстро и без заметных задержек» без числа
    kind: unverifiable
    severity: high
    core: true
    where: Часть A, Н-1
    anchors:
      - ["Перевод должен выполняться быстро и без заметных для клиента задержек"]

  - id: O-14
    title: Н-2 навязывает реализацию — таблица, СУБД и способ блокировки вместо требования к результату
    kind: design_in_requirement
    severity: medium
    core: true
    where: Часть A, Н-2
    anchors:
      - ["Остатки хранятся в таблице `account_balance` базы PostgreSQL", "строка счёта блокируется запросом `SELECT ... FOR UPDATE`"]
    keywords: ["реализаци|postgresql|субд|проектн|дизайн|select|технолог|как именно|способ"]

  - id: O-15
    title: Требования к безопасности не заполнены — стоит заглушка
    kind: incomplete
    severity: critical
    core: true
    where: Часть A, Требования к безопасности
    anchors:
      - ["Будет уточнено после согласования со службой информационной безопасности"]

  - id: O-16
    title: Версия документа и дата утверждения не заполнены
    kind: incomplete
    severity: medium
    core: false
    where: Часть A, Общие сведения
    anchors:
      - ["| **Версия документа** | — |", "| **Дата утверждения** | — |"]

  - id: O-18
    title: Критерии приёмки не покрывают превышение лимита, недостаток средств, разные валюты, отмену, повторный запрос, НФТ
    kind: incomplete
    severity: high
    core: true
    where: Часть A, Критерии приёмки
    anchors:
      - - "Критерии приёмки"
        - "Перевод выполнен, остаток счёта списания 50 000 ₸"
        - "Перевод отклонён, показана ошибка выбора счёта"
        - "Сумма переводов клиента не превышает 500 000 ₸ в сутки"
        - "При превышении лимита клиенту показывается сообщение"
        - "Если валюты счетов различаются, сумма зачисления рассчитывается по курсу банка"
        - "Списание и зачисление выполняются одной операцией"
        - "Клиент может отменить перевод в течение 5 минут после подтверждения"
        - "После выполнения перевода клиент видит квитанцию"
        - "Сервис переводов доступен 99,5 % времени за календарный месяц"
        - "Сумма перевода — от 100 ₸ до остатка на счёте списания"
    keywords:
      - "приемк|критери|тест\\w* сценари"
      - "не покры|непокрыт|покрыти|отсутств|нет критери|нет сценари|не провер|без критери|не охва"

  - id: O-19
    title: Цель обещает перевод в любое время суток, а Н-3 допускает окна обслуживания; поведение в окне не описано
    kind: contradiction
    severity: high
    core: true
    where: Часть A, Цель / Н-3
    anchors:
      - ["Перевод доступен клиенту в любое время суток"]
      - ["не считая согласованных окон обслуживания", "Сервис переводов доступен 99,5 % времени за календарный месяц"]
    keywords:
      - "любое время|круглосуточн|цел[ьи]"
      - "окн\\w* обслуживани|99,5|недоступ"
